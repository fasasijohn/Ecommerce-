services:
  - type: web
    name: servify-campus-api
    runtime: node
    rootDir: ecommerce-backend-ai
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: CORS_ORIGIN
        value: https://fasasijohn.github.io
